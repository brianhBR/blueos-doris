name: Deploy BlueOS Extension Image

on:
  push:
    branches:
      - main
    tags:
      - 'bh-*'
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: doris
  IMAGE_PREFIX: blueos-

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to Docker Hub
        uses: BlueOS-community/Deploy-BlueOS-Extension@main
        with:
          docker-username: sailorman225
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          context: ./extension
          # arm64 + amd64 only.  linux/arm/v7 (Pi 3) is dropped because
          # uvloop and lz4 don't ship manylinux2014_armv7l wheels and
          # building them from sdist under QEMU requires the C toolchain
          # (build-essential, python3-dev), which we removed to avoid
          # the gcc-14 cc1 segfault that broke the pygobject from-source
          # build on emulated arm legs.  DORIS targets Pi 4/5 (arm64).
          build-platforms: linux/arm64/v8,linux/amd64

  deploy-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=bh-(.*),group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ./extension
          # See deploy-docker above: arm/v7 is intentionally omitted.
          platforms: linux/arm64/v8,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
