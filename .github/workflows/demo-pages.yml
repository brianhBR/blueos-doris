name: Deploy Demo UI to GitHub Pages

# This workflow only exists on the demo branch. It never runs on main, and
# it never touches the extension image built by deploy.yml.
#
# One-time setup:
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Settings -> Environments -> github-pages -> add this branch to the
#      allowed deployment branches. The environment defaults to
#      default-branch-only and will otherwise reject the deploy.
on:
  push:
    branches:
      - demo/ui-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it midway.
concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: extension/frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build demo bundle
        run: yarn build:demo

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: extension/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
