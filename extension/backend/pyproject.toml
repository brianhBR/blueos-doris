[project]
name = "doris-backend"
version = "0.1.0"
description = "DORIS (Deep Ocean Research and Imaging System) BlueOS Extension Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Patrick José Pereira", email = "patrickelectric@gmail.com" }
]
keywords = ["blueos", "extension", "ocean", "research", "imaging"]

dependencies = [
    "robyn==0.76.0",
    "mcap>=1.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvloop>=0.19.0",
    "websockets>=15.0",
    "pyserial>=3.5",
    # Raw I2C access (/dev/i2c-N) for the external conductivity probe
    # (AD5933) on the Navigator's i2c6 bus.  Pure-Python, no compiler.
    "smbus2>=0.4.3",
    # NOTE: PyGObject is intentionally NOT a pip dependency.  It's
    # provided by Debian's apt python3-gi in the Dockerfile (and made
    # importable via PYTHONPATH=/usr/lib/python3/dist-packages).  We
    # used to pip-install it from sdist, but pygobject 3.50+ requires
    # libgirepository-2.0-dev (trixie-only) and the from-source build
    # deterministically segfaults gcc-14 inside QEMU on linux/arm64
    # and linux/arm/v7, breaking multi-arch CI.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
doris = "doris.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doris"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

